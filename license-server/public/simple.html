<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Create License Key</title>
    <style>body{font-family:Arial;margin:40px}button{padding:10px 16px;font-size:16px}#key{margin-top:20px;word-break:break-all;background:#f4f4f4;padding:10px;border-radius:6px}</style>
  </head>
  <body>
    <h2>Create License Key</h2>
    <p>Click to create a key. Backend will return the new key string.</p>
    <button id="create">Create Key</button>
    <div id="key">No key yet</div>

    <script>
      document.getElementById('create').addEventListener('click', async ()=>{
        const res = await fetch('/api/keys/create', {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify({})});
        const j = await res.json();
        if(j.key){
          document.getElementById('key').textContent = j.key;
          try{navigator.clipboard.writeText(j.key);}catch(e){}
        } else {
          document.getElementById('key').textContent = JSON.stringify(j);
        }
      });
    </script>
  </body>
</html>
